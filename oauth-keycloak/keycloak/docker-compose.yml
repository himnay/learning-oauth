name: learning-oauth

services:
  keycloak:
    # Red Hat build of Keycloak (RHBK), RHEL 9 based. Needs: docker login registry.redhat.io
    # No Red Hat login? Use the public upstream image instead:
    #   KEYCLOAK_IMAGE=quay.io/keycloak/keycloak:26.8.0 docker compose up -d
    image: ${KEYCLOAK_IMAGE:-registry.redhat.io/rhbk/keycloak-rhel9:26.6}
    container_name: learning-oauth-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      # Every *.json file here is imported on startup (skipped if the realm already exists).
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
