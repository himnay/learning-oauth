name: learning-oauth

services:
  keycloak:
    # Official Keycloak image, published by Red Hat on its Quay registry (Quarkus based).
    # Red Hat's supported build (RHBK) is registry.redhat.io/rhbk/keycloak-rhel9 and needs a Red Hat login.
    image: quay.io/keycloak/keycloak:26.8.0
    container_name: learning-oauth-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      # Every *.json file here is imported on startup (skipped if the realm already exists).
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
